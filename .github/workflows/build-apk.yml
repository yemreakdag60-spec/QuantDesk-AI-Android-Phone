name: Build QuantDesk Prism APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.zip'
      - 'app/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: prism-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and prepare Android source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import zipfile

          workspace = Path.cwd().resolve()

          def is_android_project(directory: Path) -> bool:
              settings = (directory / 'settings.gradle').is_file() or (directory / 'settings.gradle.kts').is_file()
              app_gradle = (directory / 'app/build.gradle').is_file() or (directory / 'app/build.gradle.kts').is_file()
              return settings and app_gradle

          def find_project(search_root: Path):
              if is_android_project(search_root):
                  return search_root
              settings_files = sorted(
                  list(search_root.rglob('settings.gradle')) + list(search_root.rglob('settings.gradle.kts'))
              )
              for settings_file in settings_files:
                  candidate = settings_file.parent
                  if is_android_project(candidate):
                      return candidate
              return None

          project = find_project(workspace)

          if project is None:
              archives = sorted(
                  workspace.glob('QuantDesk-Prism-*-Source.zip'),
                  key=lambda path: path.stat().st_mtime,
                  reverse=True,
              )
              if not archives:
                  archives = sorted(
                      (path for path in workspace.glob('*.zip') if 'prism' in path.name.lower()),
                      key=lambda path: path.stat().st_mtime,
                      reverse=True,
                  )
              if not archives:
                  raise SystemExit('No QuantDesk Prism source ZIP was found in the repository root.')

              archive_path = archives[0]
              extract_root = Path(os.environ['RUNNER_TEMP']) / 'prism-source'
              if extract_root.exists():
                  import shutil
                  shutil.rmtree(extract_root)
              extract_root.mkdir(parents=True)

              with zipfile.ZipFile(archive_path) as archive:
                  for member in archive.infolist():
                      target = (extract_root / member.filename).resolve()
                      if not target.is_relative_to(extract_root.resolve()):
                          raise SystemExit(f'Unsafe ZIP path: {member.filename}')
                  archive.extractall(extract_root)

              project = find_project(extract_root)
              if project is None:
                  print('Archive contents (first 100 files):')
                  for item in list(extract_root.rglob('*'))[:100]:
                      if item.is_file():
                          print(item.relative_to(extract_root))
                  raise SystemExit(
                      'Android project not found in source ZIP. Expected settings.gradle(.kts) '
                      'and app/build.gradle(.kts) in the same project directory.'
                  )

          project = project.resolve()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PRISM_SOURCE={project}\n')
          print(f'Android project found: {project}')
          print('Project files:')
          for name in ('settings.gradle', 'settings.gradle.kts', 'app/build.gradle', 'app/build.gradle.kts'):
              candidate = project / name
              if candidate.is_file():
                  print(f'  {name}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node for analysis tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate analysis engine
        working-directory: ${{ env.PRISM_SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/engine.test.cjs ]; then
            node --test tests/engine.test.cjs
          else
            echo "No tests/engine.test.cjs found; validation test skipped."
          fi

      - name: Build installable Debug APK
        working-directory: ${{ env.PRISM_SOURCE }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run Android lint report
        if: always()
        continue-on-error: true
        working-directory: ${{ env.PRISM_SOURCE }}
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$PRISM_SOURCE/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Debug APK was not produced: $APK_SOURCE" >&2
            exit 1
          fi
          mkdir -p output
          cp "$APK_SOURCE" output/QuantDesk-Prism.apk
          cd output
          sha256sum QuantDesk-Prism.apk > SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantDesk-Prism-APK
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuantDesk-Prism-build-reports
          path: |
            ${{ env.PRISM_SOURCE }}/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
          
