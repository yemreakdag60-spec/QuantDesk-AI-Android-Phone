name: Build QuantDesk Prism BTC 500+ APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android signing tools
        run: sdkmanager 'build-tools;35.0.0'

      - name: Check JavaScript syntax
        run: |
          node --check assets/prism-engine.js
          node --check assets/prism-app.js

      - name: Patch scanner and TP-SL assets
        run: python3 scripts/patch_apk.py --output build/QuantDesk-Prism-BTC-500-unsigned.apk

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prism-signing.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/prism-signing.jks" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/prism-signing.jks" \
              -storepass android -keypass android -alias prismdebug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=QuantDesk Prism Local Build"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/prism-signing.jks" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=prismdebug" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Sign and verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$SIGNING_KEYSTORE" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/QuantDesk-Prism-BTC-500.apk \
            build/QuantDesk-Prism-BTC-500-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify -v build/QuantDesk-Prism-BTC-500.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantDesk-Prism-BTC-500
          path: build/QuantDesk-Prism-BTC-500.apk
          if-no-files-found: error
          
