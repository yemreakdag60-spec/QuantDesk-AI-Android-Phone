name: Build Crypto Analiz 106 APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['app/**', 'server/**', 'tests/**', '*.gradle', 'gradle.properties', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: crypto-analiz-106-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out separate app project
        uses: actions/checkout@v7
      - name: Verify separate Android identity
        shell: bash
        run: |
          grep -q "applicationId 'com.emreakdag.cryptoanaliz106'" app/build.gradle
          grep -q 'android:label="Crypto Analiz 106"' app/src/main/AndroidManifest.xml
          test "$(grep -c 'applicationId' app/build.gradle)" -eq 1
      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo 'Android SDK unavailable'; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo 'sdkmanager unavailable'; exit 1; }
          set +e
          yes | "$SDKMANAGER" --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -e
          test "$SDK_STATUS" -eq 0 || exit "$SDK_STATUS"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate source and run tests
        shell: bash
        run: |
          for FILE in app/src/main/assets/*.js server/*.cjs; do node --check "$FILE"; done
          node --test tests/engine.test.cjs tests/quant.test.cjs tests/analytics.test.cjs tests/server.test.cjs tests/monitor.test.cjs tests/signal-history.test.cjs
      - name: Build and lint Android app
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Verify package and publish APK artifact
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.emreakdag.cryptoanaliz106'"
          mkdir -p output
          cp "$APK" output/Crypto-Analiz-106-1.0.0.apk
          cd output
          sha256sum Crypto-Analiz-106-1.0.0.apk > SHA256.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Crypto-Analiz-106-1.0.0-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Crypto-Analiz-106-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30
          
